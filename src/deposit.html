<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Upload to Drawer</title>
<style>body{font:16px system-ui;background:#f6f8fa;color:#17242f;margin:0;display:grid;place-items:center;min-height:100vh}main{box-sizing:border-box;max-width:620px;width:92%;padding:36px;background:white;border:1px solid #dce3eb;border-radius:24px}button,input{font:inherit;margin:12px 0;padding:10px}progress{width:100%}#result{white-space:pre-wrap}</style>
<main><h1>Upload to Drawer</h1><p>This link accepts files into a private folder. It does not allow browsing or downloading. Each file is limited to 512 MiB. Files receive unique names.</p><label>Select files <input id="files" type="file" multiple></label><button id="upload">Upload files</button><progress id="progress" max="100" value="0" aria-label="Upload progress"></progress><p id="result" role="status"></p></main>
<script>
const files=document.querySelector('#files'),button=document.querySelector('#upload'),result=document.querySelector('#result'),progress=document.querySelector('#progress');
button.onclick=async()=>{button.disabled=true;files.disabled=true;result.textContent='';try{for(const file of files.files){if(file.size>512*1024*1024)throw Error(file.name+': exceeds 512 MiB');await new Promise((resolve,reject)=>{const request=new XMLHttpRequest();request.open('POST',location.pathname+'?name='+encodeURIComponent(file.name));request.upload.onprogress=e=>{if(e.lengthComputable)progress.value=e.loaded/e.total*100};request.onload=()=>{if(request.status>=200&&request.status<300){result.textContent+='Uploaded '+file.name+'\n';resolve()}else{let message='Upload failed ('+request.status+')';try{message=JSON.parse(request.responseText).error||message}catch{}reject(Error(message))}};request.onerror=()=>reject(Error('Connection lost; select the file again to retry'));request.send(file)})}}catch(error){result.textContent+=error.message}finally{button.disabled=false;files.disabled=false}};
</script></html>
