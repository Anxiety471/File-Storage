services:
  drawer:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DRAWER_ADDR: 0.0.0.0:8787
      DRAWER_DATA_DIR: /data
      DRAWER_UI_DIR: /usr/share/drawer/ui
    ports:
      # Access over SSH forwarding, Tailscale proxy, or a TLS reverse proxy.
      # Do not publish the management API directly on the internet.
      - "127.0.0.1:8787:8787"
    volumes:
      - drawer_data:/data
      - ./backups:/backups
    security_opt:
      - no-new-privileges:true

volumes:
  drawer_data:
